<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Website</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 350px; width: 90%; }
        h1 { color: #333; margin-bottom: 0.5rem; }
        p { color: #666; margin-bottom: 1.5rem; }
        .button { display: block; background: #007bff; color: white; padding: 12px; margin: 10px 0; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .button:hover { background: #0056b3; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to My Site</h1>
        <p>Built with Gemini and GitHub Pages</p>
        <a href="#" class="button">My Portfolio</a>
        <a href="#" class="button">Contact Me</a>
        <a href="#" class="button">Follow Me</a>
    </div>
</body>
</html>
